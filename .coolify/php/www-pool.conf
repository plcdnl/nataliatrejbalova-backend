; Override del pool www per garantire che php-fpm non parta come root e
; comunichi con nginx via socket unix (più veloce di TCP su loopback, evita
; l'overhead dello stack di rete visto che i due processi sono nello stesso
; container).
; Caricato per ultimo (zzz-) per sovrascrivere qualsiasi config generata dall'immagine.
[www]
user = www-data
group = www-data
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
