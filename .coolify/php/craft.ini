; PHP settings for Craft CMS production.
; Loaded last (zzz-craft.ini) to ensure these override any image defaults.
; See: https://craftcms.com/knowledge-base/docker-in-production

memory_limit = 512M
max_execution_time = 180
max_input_time = 180
max_input_vars = 5000
post_max_size = 300M
upload_max_filesize = 300M
opcache.enable = 1
opcache.validate_timestamps = 0
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
