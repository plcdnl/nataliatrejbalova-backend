server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    set         $base /app;
    root        $base/web;
    # security
    include     craftcms/security.conf;

    # index
    index index.html index.htm index.php;

    # Endpoint usato da s6-overlay/healthcheck del compose per verificare che nginx sia pronto
    location = /healthcheck {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Craft CMS Stuff
    location ~ .*/api/.* {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ .*/actions/.* {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /admin {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /gql {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(sitemap.*|robots\.txt|security\.txt) {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /assets/ {
        root /app/web;
        try_files $uri $uri/ @craft;
    }

    location @craft {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /cpresources/ {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /static/ {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /uploads/ {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        root /app/web;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # additional config
    include craftcms/general.conf;

    # handle .php
    location ~ \.php$ {
        include craftcms/php_fastcgi.conf;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
